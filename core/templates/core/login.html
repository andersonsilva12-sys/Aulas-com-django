<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>login | Aula Django</title>
</head>
<body>
    <main>
        <h1>Entrar</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" >Entrar</button>
        </form>
        <a href="{%url 'core:inicio'%}">voltar ao inicio</a> 
    </main>
</body>
</html>
