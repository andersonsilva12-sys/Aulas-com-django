<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Início | Aula Django</title>
</head>
<body>
    <main>
        <h1>Views e URLs no Django</h1>
        <p>Esta página é atendida por uma Function-Based View.</p>
        <nav aria-label="Navegação principal">
            <ul>
                <li><a href="{% url 'core:lista_autores' %}">[Listar Autores]</a></li>
            </ul>
        </nav>

        <li><a href="{% url 'core:area_restrita' %}" >Área restrita</a></li>
        {% if user.is_authenticated %}
            <li>Olá, {{ user.username }}!</li>
            <li>
                <form method="post" action="{% url 'core:logout' %}">
                    {% csrf_token %}
                    <button type="submit">Sair</button>
                </form>
            </li>
        {% else %}
            <li><a href="{% url 'core:login' %}">Entrar</a></li>
        {% endif %}
        
    </main>
</body>
</html>
